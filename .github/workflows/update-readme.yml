name: Update README

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        run: python generate_readme.py

      - name: Commit changes
        run: |
          git add "./select-training/computer-firm/README.md"
          git add "./README.md"
          git diff --cached --quiet || git commit -m "docs: update README"
          git push